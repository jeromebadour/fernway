# fernway.jeromebadour.com: every request goes to the web container on 127.0.0.1:3103 (compose.yaml in
# /srv/fernway/app). Included from /etc/nginx/sites-enabled/fernway, inside its server block.
# Installed to /etc/nginx/snippets/.

# Forms and webhooks are small; GHL and Stripe webhooks stay well under this.
client_max_body_size 256k;
access_log /var/log/nginx/fernway.access.log fernway;

location / {
    proxy_pass http://127.0.0.1:3103;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Always the real address, replacing anything the visitor sent: the per-visitor limits count on it.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}
