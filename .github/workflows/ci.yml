      - name: Webhooks out - a lead event reaches an endpoint once, signed so the receiver can check it
        run: |
          W="$COMPOSE exec -T worker node apps/worker/dist/cli.js"
          ACC=$(psql -At -c "select account_id from ghl_connections order by account_id limit 1")
          ROUTE=$(psql -At -c "select key from routes where account_id = $ACC and calendar_id is null order by id limit 1")
          # Only https and public addresses; CI's stand-in is the one host allowed over http.
          if $W hook $ACC Private https://10.0.0.5/x signed > /tmp/h.txt 2>&1; then exit 1; fi
          grep -q "a public address" /tmp/h.txt
          SECRET=$($W hook $ACC "CI receiver" http://fake-ghl:4010/hook picked_up,signed | tail -1)
          echo "$SECRET" | grep -Eq '^whsec_[A-Za-z0-9_-]{32}$'
          $W send-test $ACC $ROUTE hook-ci@northpine-ci.com
          for i in $(seq 1 30); do
            test "$(curl -sf http://127.0.0.1:4010/__hooks | node -e 'console.log(JSON.parse(require("fs").readFileSync(0)).filter((h)=>h.body.includes("hook-ci@")).length)')" = 2 && break; sleep 2
          done
          curl -sf http://127.0.0.1:4010/__hooks > /tmp/hooks.json
          SECRET="$SECRET" node -e '
            const c = require("crypto"); const hs = JSON.parse(require("fs").readFileSync("/tmp/hooks.json")).filter((h) => h.body.includes("hook-ci@"));
            if (hs.length !== 2) process.exit(1);
            for (const h of hs) {
              const p = Object.fromEntries(h.headers["fernway-signature"].split(",").map((x) => x.split("=")));
              const want = c.createHmac("sha256", process.env.SECRET).update(p.t + "." + h.body).digest("hex");
              if (want !== p.v1) process.exit(2);
              const b = JSON.parse(h.body);
              if (b.id !== h.headers["fernway-delivery"] || b.type !== h.headers["fernway-event"]) process.exit(3);
            }
            const types = hs.map((h) => JSON.parse(h.body).type).sort().join(",");
            if (types !== "lead.picked_up,lead.signed") process.exit(4);'
          test "$(psql -At -c "select count(*) from webhook_deliveries where state = 'delivered'")" = 2
          test "$(psql -At -c "select count(*) from audit_log where action = 'hook.made'")" = 1

      - name: Make - the hot leads blueprint parses and holds placeholders, never a secret
        run: |
          python3 - <<'PY'
          import json, re
          raw = open("integrations/make/fernway-hot-leads.blueprint.json").read()
          b = json.loads(raw)
          for p in ("PASTE_FERNWAY_SECRET_HERE", "PASTE_RESEND_KEY_HERE", "PASTE_SPREADSHEET_ID_HERE"):
              assert raw.count(p) == 1, p
          assert not re.search(r"whsec_|\bre_[A-Za-z0-9]{8,}", raw), "a secret in the blueprint"
          ids = [m["id"] for m in b["flow"]]
          assert len(ids) == len(set(ids)) == 13, ids
          f = {m["id"]: m.get("filter", {}).get("name") for m in b["flow"]}
          assert f[10] and f[11], f
          PY

      - name: n8n - the hot leads workflow imports into the pinned n8n, answers a signed call 200 and an unsigned one 400
        run: |
          version=$(grep -oP '^version=\K.*' integrations/n8n/setup.sh)
          docker run -d --name n8n-ci -p 127.0.0.1:5690:5678 -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_SECURE_COOKIE=false \
            -e NODE_FUNCTION_ALLOW_BUILTIN=crypto -e N8N_BLOCK_ENV_ACCESS_IN_NODE=false -e FERNWAY_HOOK_SECRET=whsec_ci_n8n_secret \
            -e N8N_ENCRYPTION_KEY=ci0123456789abcdef0123456789abcd "docker.n8n.io/n8nio/n8n:$version"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5690/healthz/readiness > /dev/null && break; sleep 2; done
          node -e 'const c=require("crypto");const k=c.generateKeyPairSync("rsa",{modulusLength:2048});require("fs").writeFileSync("/tmp/cred.json",JSON.stringify([{id:"fernwayGoogleSa1",name:"Fernway Google service account",type:"googleApi",data:{email:"ci@ci.iam.gserviceaccount.com",privateKey:k.privateKey.export({type:"pkcs8",format:"pem"})}}]))'
          docker cp /tmp/cred.json n8n-ci:/tmp/cred.json
          docker cp integrations/n8n/fernway-hot-leads.json n8n-ci:/tmp/wf.json
          docker exec -u node n8n-ci sh -c 'n8n import:credentials --input=/tmp/cred.json && n8n import:workflow --input=/tmp/wf.json && n8n publish:workflow --id=FernwayHotLeads1'
          docker restart n8n-ci > /dev/null
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5690/healthz/readiness > /dev/null && break; sleep 2; done
          sleep 5
          node -e '
            const c = require("crypto");
            const body = JSON.stringify({ id: "evt_ci", type: "lead.signed", created: new Date().toISOString(), data: { waybill: "FW 26 00001" } });
            const t = Math.floor(Date.now() / 1000);
            const sig = (s) => `t=${t},v1=${c.createHmac("sha256", s).update(t + "." + body).digest("hex")}`;
            const go = (h) => fetch("http://127.0.0.1:5690/webhook/fernway-leads", { method: "POST", headers: { "content-type": "application/json", ...h }, body }).then(async (r) => [r.status, await r.text()]);
            (async () => {
              const good = await go({ "fernway-signature": sig("whsec_ci_n8n_secret") });
              const bad = await go({ "fernway-signature": sig("whsec_wrong") });
              const none = await go({});
              console.log(good, bad, none);
              if (good[0] !== 200 || !good[1].includes("evt_ci") || bad[0] !== 400 || none[0] !== 400) process.exit(1);
            })();'
          docker rm -f n8n-ci > /dev/null

