          wp plugin activate fernway
          wp option update fernway_url http://127.0.0.1:3103
          wp option update fernway_api_key "$KEY" > /dev/null
          wp option update fernway_route roof-check
          wp option update fernway_area "983, 984"
          wp eval-file /opt/site/setup.php | tee /tmp/setup.txt; grep -q "site ready" /tmp/setup.txt
          # The setup is safe to run again: every page is kept as it is.
          wp eval-file /opt/site/setup.php | grep -c "kept" | grep -qx 5
          B=http://127.0.0.1
          curl -sf $B/ > /tmp/home.html
          grep -q "Know what your roof" /tmp/home.html; grep -q 'class="fernway fw-compact' /tmp/home.html; grep -q "Call me back" /tmp/home.html
          curl -sf $B/roof-check/ > /tmp/rc.html
          grep -q 'class="fernway fw-full' /tmp/rc.html; grep -q 'name="fw_day"' /tmp/rc.html
          curl -s -o /dev/null -w '%{http_code}' $B/no-such-page/ | grep -qx 404; curl -s $B/no-such-page/ | grep -q "This page has a leak"
          # The form as the page drew it: its signed settings, and the first free morning or afternoon.
          python3 - <<'PY'
          import html, re, json
          page = open("/tmp/rc.html").read()
          form = page[page.index('class="fernway fw-full'):]
          val = lambda n: html.unescape(re.search(r'name="%s" value="([^"]*)"' % n, form).group(1))
          slots = [v for v in re.findall(r'data-(?:am|pm)="([^"]*)"', form) if v]
          json.dump({"fw_settings": val("fw_settings"), "fw_settings_sig": val("fw_settings_sig"), "slot": slots[0], "other": slots[1]}, open("/tmp/form.json", "w"))
          PY
          send() { python3 - "$@" <<'PY'
          import json, sys, urllib.parse, urllib.request
          f = json.load(open("/tmp/form.json")); phone, key = sys.argv[1], sys.argv[2]
          body = urllib.parse.urlencode({"fw_settings": f["fw_settings"], "fw_settings_sig": f["fw_settings_sig"], "fw_key": key, "slot": f["slot"],
            "address": "14 Cedar Ln, Tacoma, WA 98406", "name": "Dana Whitfield", "phone": phone, "email": "dana@example.com", "message": "Old roof"}).encode()
          req = urllib.request.Request("http://127.0.0.1/wp-json/fernway/v1/send", data=body, headers={"Content-Type": "application/x-www-form-urlencoded"})
          try: r = urllib.request.urlopen(req); code, out = r.status, json.load(r)
          except urllib.error.HTTPError as e: code, out = e.code, json.load(e)
          json.dump(out, open("/tmp/sent.json", "w")); print(code)
          PY
          }
          # A short phone number is caught by the plugin, in words, before anything reaches Fernway.
          test "$(send '253 555 01' ci-wp-0001)" = 422
          python3 -c "import json; p=json.load(open('/tmp/sent.json'))['problems']; assert p['phone']=='Two digits short: a US number has 10.', p"
          test "$(send '(253) 555-0142' ci-wp-0001)" = 201
          N=$(python3 -c "import json; print(json.load(open('/tmp/sent.json'))['number'])"); T=$(python3 -c "import json; print(json.load(open('/tmp/sent.json'))['sig'])")
          echo "$N" | grep -Eq '^FW [0-9]{2} [0-9]{5}$'
          # The receipt follows the lead to signed for; another number, or a wrong signature, gets nothing.
          for i in $(seq 1 30); do curl -sG $B/wp-json/fernway/v1/receipt --data-urlencode "n=$N" --data-urlencode "t=$T" > /tmp/r.json; python3 -c "import json,sys; sys.exit(0 if not json.load(open('/tmp/r.json'))['moving'] else 1)" && break; sleep 1; done
          grep -q "Signed for" /tmp/r.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -G $B/wp-json/fernway/v1/receipt --data-urlencode "n=$N" --data-urlencode "t=000000000000000000000000")" = 404
          # The booking is in the fake GHL's calendar, and the address in the contact's own fields.
          curl -s 127.0.0.1:4010/__calls | python3 -c "import json,sys; d=json.load(sys.stdin); assert {'method':'POST','path':'/calendars/events/appointments'} in d"
          curl -s 127.0.0.1:4010/__contacts | python3 -c "
          import json,sys; c=[x for x in json.load(sys.stdin) if x.get('email')=='dana@example.com'][-1]
          assert (c['address1'],c['city'],c['state'],c['postalCode'],c['country'],c['phone'])==('14 Cedar Ln','Tacoma','WA','98406','US','+12535550142'), c"
          # The calendar file carries Fernway's own meeting time.
          curl -sfG $B/wp-json/fernway/v1/calendar --data-urlencode "n=$N" --data-urlencode "t=$T" | grep -q "^DTSTART:"
          # The same send again (a double click, a retry) is the same lead; the log says so, and holds no visitor data.
          test "$(send '(253) 555-0142' ci-wp-0001)" = 201
          test "$(python3 -c "import json; print(json.load(open('/tmp/sent.json'))['number'])")" = "$N"
          wp option get fernway_log --format=json > /tmp/log.json
          python3 -c "
          import json; l=json.load(open('/tmp/log.json')); assert [e['outcome'] for e in l[:2]]==['duplicate','sent'], l[:2]
          assert 'dana' not in json.dumps(l).lower() and '555' not in json.dumps(l), 'visitor data in the log'"
          # Without JavaScript: a plain post, then back to the page with a signed receipt.
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          f = json.load(open("/tmp/form.json"))
          body = urllib.parse.urlencode({"action": "fernway_send", "fw_id": "f1", "fw_settings": f["fw_settings"], "fw_settings_sig": f["fw_settings_sig"],
            "fw_day": "", "slot": f["other"], "address": "1 Main St, Puyallup, WA 98371", "name": "Sam Ortega", "phone": "253 555 0188"}).encode()
          class Stop(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a): return None
          op = urllib.request.build_opener(Stop)
          req = urllib.request.Request("http://127.0.0.1/wp-admin/admin-post.php", data=body, headers={"Referer": "http://127.0.0.1/roof-check/"})
          try: op.open(req); raise SystemExit("no redirect")
          except urllib.error.HTTPError as e:
              loc = e.headers["Location"]; assert e.code == 302 and "fernway_sent=FW" in loc and "#fernway-f1" in loc, loc
              page = urllib.request.urlopen(loc.split("#")[0]).read().decode()
              assert "See you" in page and "Sam" in page, "the server did not draw the receipt"
          PY
          # A time that was taken in between is refused in words, and the log says why.
          test "$(send '(253) 555-0199' ci-wp-0002)" = 409
          python3 -c "import json; p=json.load(open('/tmp/sent.json'))['problems']; assert 'took that time' in p['slot'], p"
          # The connection test's calls, and the log emptied of anything over 30 days old.
          wp eval 'echo Fernway\Client::call("GET", "/api/v1/leads/FW-00-00000")["status"];' | grep -qx 404
          wp eval 'update_option("fernway_log", array_merge(Fernway\Log::all(), [["at"=>time()-40*DAY_IN_SECONDS,"route"=>"old","outcome"=>"sent","status"=>201,"number"=>"","problem"=>"","page"=>""]])); Fernway\Log::purge(); echo count(array_filter(Fernway\Log::all(), fn($e) => $e["route"]==="old"));' | grep -qx 0
          # Elementor: the same form as a widget.
          wp plugin install elementor --activate > /dev/null
          wp eval '$w = \Elementor\Plugin::instance()->elements_manager->create_element_instance(["elType"=>"widget","widgetType"=>"fernway_form","id"=>"ci00001","settings"=>["route"=>"callback","fields"=>["name","phone"],"submit"=>"Call me back"]]); ob_start(); $w->print_element(); echo ob_get_clean();' > /tmp/el.html
          grep -q 'class="fernway fw-full' /tmp/el.html; grep -q "Call me back" /tmp/el.html
          docker rm -f wp wpdb > /dev/null

      - name: Accounts, end to end (switched on for this step only; production keeps them off)
        run: |
          FERNWAY_ACCOUNTS=on FERNWAY_MAIL_OUTBOX=on $COMPOSE up -d --no-build web
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3103/api/health && break; sleep 2; done
          trap 'echo "a check failed at line $LINENO; the last answer was: $(cat /tmp/r.json 2>/dev/null)"' ERR
          B=http://127.0.0.1:3103; J=/tmp/jar.txt; rm -f $J; E="lena$RANDOM@northpine.dental"
          post() { curl -s -o /tmp/r.json -w '%{http_code}' -b $J -c $J -H "origin: $B" -H 'content-type: application/json' -d "$2" $B$1; }
          has() { grep -q "$1" /tmp/r.json || { echo "expected $1 in: $(cat /tmp/r.json)"; exit 1; }; }
          link() { $COMPOSE exec -T redis redis-cli -a "$REDIS_PASSWORD" --no-auth-warning lindex fernway:outbox 0 \
            | python3 -c "import json,sys,re; print(re.search(r'https?://[^/ ]+(/(?:confirm|reset)/[A-Za-z0-9_-]+)', json.load(sys.stdin)['text']).group(1))"; }
          code() { curl -s -o /dev/null -w '%{http_code}' -b $J "$B$1"; }
          # Sign up: signed in at once, a confirm link sent; the same email again is refused.
          test "$(post /api/account/sign-up "{\"email\":\"$E\",\"name\":\"Lena Hartmann\",\"company\":\"Northpine Dental\",\"password\":\"northpine-2026!\"}")" = 201
          grep -q fw_session $J
          curl -s -b $J $B/account | grep -q "Not confirmed"
          test "$(post /api/account/sign-up "{\"email\":\"$E\",\"name\":\"X\",\"company\":\"Y\",\"password\":\"northpine-2026!\"}")" = 409
          # The confirm link works once.
          C=$(link); test "$(code $C)" = 307
          curl -s -b $J $B/account | grep -q "Confirmed"
          curl -s -b $J $B$C | grep -q "This link has done its job"
          # Profile saves; sign out ends the session.
          test "$(post /api/account/profile '{"name":"Lena H.","company":"Northpine Dental Group","timeZone":"Europe/Paris"}')" = 200
          curl -s -b $J $B/account | grep -q "Northpine Dental Group"
          test "$(post /api/account/sign-out '{}')" = 200
          test "$(code /account)" = 307
          # A wrong email and a wrong password get the same answer; the right one signs in.
          test "$(post /api/account/sign-in "{\"email\":\"$E\",\"password\":\"nope-nope-nope\"}")" = 401; cp /tmp/r.json /tmp/a.json
          test "$(post /api/account/sign-in '{"email":"ghost@northpine.dental","password":"nope-nope-nope"}')" = 401; cmp /tmp/r.json /tmp/a.json
          test "$(post /api/account/sign-in "{\"email\":\"$E\",\"password\":\"northpine-2026!\",\"next\":\"//evil.example\"}")" = 200; has '"next":"/account"'
          # Reset: the same answer for anyone; the link works once and ends every session.
          test "$(post /api/account/reset-request '{"email":"ghost@northpine.dental"}')" = 200; has '"ok":true'
          test "$(post /api/account/reset-request "{\"email\":\"$E\"}")" = 200
          R=$(link); T=${R#/reset/}
          test "$(post /api/account/reset "{\"token\":\"$T\",\"password\":\"a-new-password-2026\"}")" = 200
          test "$(code /account)" = 307
          test "$(post /api/account/sign-in "{\"email\":\"$E\",\"password\":\"northpine-2026!\"}")" = 401
          test "$(post /api/account/sign-in "{\"email\":\"$E\",\"password\":\"a-new-password-2026\"}")" = 200
          test "$(post /api/account/reset "{\"token\":\"$T\",\"password\":\"another-password-1\"}")" = 422
          # A form from another site, or with no origin, changes nothing.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d '{}' $B/api/account/sign-out)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'origin: https://evil.example' -H 'content-type: application/json' -d '{}' $B/api/account/sign-out)" = 403
          # Only the account API sets a cookie; no page does.
          for p in / /trial /pricing /sign-in /sign-up /reset; do
            if curl -s -D - -o /dev/null $B$p | grep -qi '^set-cookie'; then echo "$p sets a cookie"; exit 1; fi
          done
          # The operator console doesn't exist for a customer: its pages and actions answer 404.
          for p in /operator /operator/accounts /operator/staff; do test "$(code $p)" = 404; done
          test "$(post /api/operator/incidents/ack '{"id":1,"code":"123456"}')" = 404
          # Back to how production runs: accounts off.
          $COMPOSE up -d --no-build web
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3103/api/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/sign-in)" = 404

      - name: The plain pages answer, and the public site sets no cookies
        # Privacy promises no cookies on the public site: every public page is checked for a Set-Cookie header.
        run: |
          B=http://127.0.0.1:3103
          curl -s $B/privacy | grep -q "How long it is kept"
          curl -s $B/terms | grep -q "What Fernway is"
          curl -s $B/about | grep -q "What is real"
          curl -s $B/delivery | grep -q "What happens when GHL says no"
          # The changelog is this repo's real history: the commit under test is its newest entry.
          curl -s $B/changelog | grep -qF "$(git log -1 --format=%h)"
          # Accounts are pictured but not wired yet: their pages stay hidden.
          for p in /sign-up /sign-in /account; do test "$(curl -s -o /dev/null -w '%{http_code}' $B$p)" = 404; done
          # The operator console's public demo: invented data, read-only, open to anyone; the real one is a 404.
          curl -s $B/demo/operator | grep -q "Read-only demo"
          curl -s $B/demo/operator/accounts/37 | grep -q "Lumen Studio"
          # And the customer console's: the same pages over an invented clinic, with no account behind it.
          curl -s $B/demo/console | grep -q "Harbor Physio"
          curl -s $B/demo/console/lead/918397 | grep -q "FW 26 18397"
          curl -s "$B/demo/console/log?state=held" | grep -q "Held"
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/console)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/operator)" = 404
          for p in / /pricing /trial /contact /demo /track /break-it /privacy /terms /about /docs /docs/api /delivery /status /changelog /api/slots /demo/operator /demo/operator/staff /demo/console /demo/console/team; do
            if curl -s -D - -o /dev/null $B$p | grep -qi '^set-cookie'; then echo "$p sets a cookie"; exit 1; fi
          done

      - name: A backup is made, and it restores
        # The real scripts, as root, as the box's timers run them: a checked pg_dump, then the restore test into a
        # scratch database next to the live one, every table compared. (Account 1 exists by now, so the dump isn't empty.)
        run: |
          sudo BACKUP_DIR=/tmp/fernway-backups ops/backup.sh
          sudo BACKUP_DIR=/tmp/fernway-backups ops/restore-test.sh | tee /tmp/restore.txt
          grep -q "RESTORE OK" /tmp/restore.txt
          # Every table comes back with the live count, and there is something to restore.
          python3 -c "
          import re; rows=[l.split() for l in open('/tmp/restore.txt') if re.match(r'^  [a-z_]+ +[0-9]+ +[0-9]+$', l)]
          assert rows and all(r[1]==r[2] for r in rows), rows
          assert dict((r[0], int(r[1])) for r in rows)['accounts'] >= 1, rows"
          sudo test "$(sudo stat -c %a /tmp/fernway-backups)" = 700
          test "$(psql -Atc "select count(*) from pg_database where datname = 'fernway_restore_test'")" = 0
          # Both runs are recorded for the status page, which shows them.
          test "$(psql -Atc "select string_agg(kind || ':' || ok, ',' order by id) from ops_runs")" = "backup:true,restore_test:true"
          curl -s http://127.0.0.1:3103/status > /tmp/status.html
          grep -q "Nightly backup" /tmp/status.html; grep -q "Restore test" /tmp/status.html; grep -q "Every part is running" /tmp/status.html
          # A dump cut in half must fail the restore test, not pass it.
          f=$(sudo sh -c 'ls /tmp/fernway-backups/fernway-*.dump | tail -1')
          sudo sh -c "head -c \$(( \$(stat -c %s $f) / 2 )) $f > $f.half && mv $f.half $f"
          if sudo BACKUP_DIR=/tmp/fernway-backups ops/restore-test.sh; then echo "a broken dump passed the restore test"; exit 1; fi
          sudo grep -q '"ok": false' /tmp/fernway-backups/restore-test.json
          test "$(psql -Atc "select ok from ops_runs where kind = 'restore_test' order by id desc limit 1")" = f
          curl -s http://127.0.0.1:3103/status | grep -q "Failed"

      - name: The backup goes off the box encrypted, and that copy restores
        # The same scripts with the off-box copy on (ops/offsite.sh), pointed at a folder instead of R2: the dump is
        # encrypted with age before it leaves; the restore test downloads and decrypts the newest copy and restores it.
        run: |
          # age and rclone come straight from their own releases, pinned by checksum, so CI never waits on Ubuntu's mirror.
          tools=$(mktemp -d)
          curl -fsSL -o $tools/age.tgz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          curl -fsSL -o $tools/rclone.zip https://github.com/rclone/rclone/releases/download/v1.71.2/rclone-v1.71.2-linux-amd64.zip
          printf '%s  %s\n' 7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50 $tools/age.tgz \
            ab9fa5877cee91c64fdfd61a27028a458cf618b39259e5c371dc2ec34a12e415 $tools/rclone.zip | sha256sum -c --quiet
          tar -xzf $tools/age.tgz -C $tools && unzip -qo $tools/rclone.zip -d $tools
          sudo install -m 755 $tools/age/age $tools/age/age-keygen $tools/rclone-v1.71.2-linux-amd64/rclone /usr/local/bin/
          sudo sh -c 'age-keygen -o /tmp/offsite-age.key 2> /dev/null'
          off="OFFSITE_REMOTE=:local:/tmp/offsite OFFSITE_KEY=/tmp/offsite-age.key BACKUP_DIR=/tmp/fernway-backups"
          sudo env $off ops/backup.sh | tee /tmp/offsite.txt
          grep -q "kept off the box" /tmp/offsite.txt
          sudo sh -c 'head -c 21 "$(ls /tmp/offsite/*.age | head -1)"' | grep -q "age-encryption.org"
          sudo env $off ops/restore-test.sh | tee /tmp/restore-offsite.txt
          grep -q "from off the box" /tmp/restore-offsite.txt
          grep -q "RESTORE OK" /tmp/restore-offsite.txt
          if sudo env OFFSITE_REMOTE=:local:/proc/nope OFFSITE_KEY=/tmp/offsite-age.key BACKUP_DIR=/tmp/fernway-backups ops/backup.sh; then
            echo "a failed upload did not fail the backup"; exit 1
          fi
          sudo grep -q '"ok": false' /tmp/fernway-backups/offsite.json
          test "$(psql -Atc "select string_agg(ok::text, ',' order by id) from ops_runs where kind = 'offsite'")" = "true,false"

      - name: The app's role reads and writes, but can't change tables
        run: |
          test "$(psql -Atc "select rolsuper or rolcreaterole or rolcreatedb from pg_roles where rolname = 'fernway_app'")" = f
          if PGUSER=fernway_app PGPASSWORD=$FERNWAY_APP_PASSWORD psql -qc "create table nope (id int)" 2>/dev/null; then
            echo "fernway_app could create a table"; exit 1
          fi

      - name: A second deploy applies nothing twice
        run: |
          out=$($COMPOSE run --rm migrate)
          echo "$out"
          if echo "$out" | grep -q applying; then echo "a migration ran twice"; exit 1; fi

      - name: Health tells the truth when the worker stops
        run: |
          $COMPOSE stop worker
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3103/api/health)
            [ "$code" = 503 ] && { echo "health 503 with the worker down"; exit 0; }
            sleep 2
          done
          echo "health still said ok with the worker down"; exit 1

      - name: Logs on failure
        if: failure()
        run: |
          $COMPOSE ps -a || true
          $COMPOSE logs --tail 200 || true
