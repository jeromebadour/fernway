      - name: Break it, through the real queue, never reaching a GHL
        # The demo account's leads run against the stand-in inside Fernway. Here the fake GHL server plays the real GHL,
        # so it proves none of Break it's calls ever leave Fernway.
        run: |
          B=http://127.0.0.1:3103
          W="$COMPOSE exec -T worker node apps/worker/dist/cli.js"
          $W account "Break it demo" | grep -q "^account 2"
          $W route 2 breakit "Break it" breakit_pipeline breakit_new breakit | grep -q "route breakit"
          before=$(curl -s 127.0.0.1:4010/__calls | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          go() { curl -s -H 'content-type: application/json' -H "x-real-ip: $1" -d "{\"failure\":\"$2\",\"key\":\"$3\"}" $B/api/breakit; }
          state() { curl -s "$B/api/track/$1" | python3 -c 'import json,sys; print(json.load(sys.stdin)["view"]["state"])'; }
          wait_for() { for i in $(seq 1 30); do [ "$(state $1)" = "$2" ] && return 0; sleep 1; done; echo "$1 never reached $2: $(state $1)"; return 1; }
          tok() { python3 -c 'import json,sys; print(json.load(sys.stdin)["track"])'; }
          busy=$(go 10.0.0.50 busy $(cat /proc/sys/kernel/random/uuid) | tok); wait_for $busy signed
          curl -s "$B/api/track/$busy" | python3 -c '
          import json,sys; k=[s["kind"] for s in json.load(sys.stdin)["view"]["scans"]]
          assert k==["picked_up","checked","retry_scheduled","handed","signed"], k'
          bad=$(go 10.0.0.50 refused $(cat /proc/sys/kernel/random/uuid) | tok); wait_for $bad held
          curl -s "$B/api/track/$bad" | grep -q "valid number with its country code"
          if curl -s "$B/api/track/$bad" | grep -q '{\\"message'; then echo "the receipt shows GHL's raw JSON"; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d "{\"track\":\"$bad\"}" $B/api/breakit/resend)" = 200
          wait_for $bad signed
          k=$(cat /proc/sys/kernel/random/uuid)
          one=$(go 10.0.0.51 twice $k | python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])')
          two=$(go 10.0.0.51 twice $k | python3 -c 'import json,sys; j=json.load(sys.stdin); assert j["duplicate"]; print(j["number"])')
          test "$one" = "$two"
          # A forged receipt link resends nothing.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d "{\"track\":\"${bad%??}xx\"}" $B/api/breakit/resend)" = 404
          after=$(curl -s 127.0.0.1:4010/__calls | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "$before" != "$after" ]; then
            echo "Break it reached the fake GHL:"; curl -s 127.0.0.1:4010/__calls | python3 -c "import json,sys; print(json.load(sys.stdin)[$before:])"; exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/break-it)" = 200

      - name: The API takes, tracks and refuses leads as its docs say, and the docs' key reaches only the demo
        run: |
          B=http://127.0.0.1:3103
          W="$COMPOSE exec -T worker node apps/worker/dist/cli.js"
          $W route 2 demo "API demo" - api | grep -q "route demo"
          D=$($W apikey 2 "Docs (public)" | tail -1); R=$($W apikey 1 "CI" | tail -1)
          echo "$D" | grep -Eq '^fw_[a-z0-9]{8}_[a-z0-9]{32}$'
          before=$(curl -s 127.0.0.1:4010/__calls | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          post() { curl -s -o /tmp/a.json -w '%{http_code}' -H "authorization: Bearer $1" -H 'content-type: application/json' -H 'x-real-ip: 10.0.0.60' -d "$2" $B/api/v1/leads; }
          j() { python3 -c "import json; print(json.load(open('/tmp/a.json'))$1)"; }
          signed() { for i in $(seq 1 20); do curl -s -H "authorization: Bearer $1" $B$2 > /tmp/a.json; [ "$(j '["lead"]["state"]')" = signed ] && return 0; sleep 1; done; cat /tmp/a.json; return 1; }
          k=docs-$(cat /proc/sys/kernel/random/uuid)
          lead="{\"idempotencyKey\":\"$k\",\"route\":\"demo\",\"contact\":{\"firstName\":\"Ada\",\"email\":\"ada@example.com\"}}"
          test "$(post $D "$lead")" = 201; n=$(j '["number"]'); self=$(j '["links"]["self"]')
          test "$(post $D "$lead")" = 200; test "$(j '["duplicate"]')" = True; test "$(j '["number"]')" = "$n"
          signed $D $self
          python3 -c "import json; d=json.load(open('/tmp/a.json')); assert 'consignee' not in d['lead'], d"
          # Another account's key can't see it; no key, a wrong one, a bad lead and a chosen source are each refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $R" $B$self)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/api/v1/leads)" = 401
          test "$(post ${D%????}zzzz "$lead")" = 401
          test "$(post $D '{"idempotencyKey":"docs-bad-0001","route":"demo","contact":{"email":"nope"}}')" = 422
          j '["problems"]' | grep -q "contact.email"
          test "$(post $D '{"idempotencyKey":"docs-bad-0002","route":"demo","source":"form","contact":{"email":"a@b.co"}}')" = 422
          after=$(curl -s 127.0.0.1:4010/__calls | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "$before" != "$after" ]; then echo "the docs' key reached the fake GHL"; exit 1; fi
          # A real account's key delivers into its GHL (here the fake one).
          test "$(post $R "{\"idempotencyKey\":\"ci-$(cat /proc/sys/kernel/random/uuid)\",\"route\":\"trial\",\"contact\":{\"email\":\"api@example.com\"}}")" = 201
          rself=$(j '["links"]["self"]')
          signed $R $rself
          curl -s 127.0.0.1:4010/__calls | python3 -c "import json,sys; d=json.load(sys.stdin)[$after:]; assert {'method':'POST','path':'/contacts/upsert'} in d, d"
          # A booking route's free times, then a booking with an address: taken once, given back to a retry, refused to another.
          slots() { curl -s -o /tmp/a.json -w '%{http_code}' -H "authorization: Bearer $R" $B/api/v1/routes/$1/slots; }
          test "$(slots nope)" = 404; test "$(slots trial)" = 422; j '["problems"]' | grep -q "books no meetings"
          test "$(slots demo)" = 200; at=$(j '["slots"][0]'); test -n "$at"
          bk="ci-book-$(cat /proc/sys/kernel/random/uuid)"
          booking() { echo "{\"idempotencyKey\":\"$1\",\"route\":\"demo\",\"slot\":\"$at\",\"contact\":{\"firstName\":\"Dana\",\"email\":\"dana@example.com\",\"address\":{\"line1\":\"14 Cedar Ln\",\"city\":\"Tacoma\",\"state\":\"WA\",\"postalCode\":\"98406\",\"country\":\"us\"}}}"; }
          test "$(post $R "$(booking $bk)")" = 201; bself=$(j '["links"]["self"]')
          signed $R $bself
          test "$(j '["lead"]["meeting"]')" = "$at"
          test "$(post $R "$(booking $bk)")" = 200; test "$(j '["duplicate"]')" = True
          test "$(post $R "$(booking ci-book-other-$bk)")" = 409; j '["problems"]' | grep -q "just taken"
          test "$(slots demo)" = 200; python3 -c "import json; d=json.load(open('/tmp/a.json')); assert '$at' not in d['slots'], d['slots'][:3]"
          # A revoked key stops at once.
          $W revoke-apikey "$(echo $R | cut -d_ -f2)" | grep -q revoked
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $R" $B$rself)" = 401
          # The OpenAPI file and the docs pages.
          curl -s $B/api/v1/openapi.json | python3 -c '
          import json,sys; d=json.load(sys.stdin)
          assert d["openapi"]=="3.1.0" and set(d["paths"])=={"/api/v1/leads","/api/v1/leads/{number}","/api/v1/routes/{route}/slots"}, d["paths"].keys()
          assert "contact" in d["paths"]["/api/v1/leads"]["post"]["requestBody"]["content"]["application/json"]["schema"]["properties"]'
          curl -s $B/docs | grep -q "Your first lead, in one request"
          curl -s $B/docs/api | grep -q "idempotencyKey"
          curl -s $B/docs/api | grep -q "routes/{route}/slots"

