# CI only, on top of compose.yaml: the tests reach the database as its owner, and the web app and the worker talk to a
# fake GHL (scripts/fake-ghl.mjs) instead of the real one. Never used on the box.
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
  fake-ghl:
    image: node:22-bookworm-slim
    command: ["node", "/fake/fake-ghl.mjs"]
    volumes:
      - ./scripts/fake-ghl.mjs:/fake/fake-ghl.mjs:ro
    ports:
      - "127.0.0.1:4010:4010"
  web:
    environment:
      APP_URL: http://localhost:3103
      FERNWAY_GHL_API: http://fake-ghl:4010
      FERNWAY_GHL_WEBHOOK_KEY: ${CI_GHL_WEBHOOK_KEY:-}
      GHL_SSO_KEY: ci-ghl-shared-secret
      FERNWAY_WORKFLOW_KEY: ci-workflow-key-0123456789abcdef
      # Google Sheets against the stand-in Google in fake-ghl.mjs, with this run's own service account key.
      GOOGLE_SHEETS_KEY: ${CI_GOOGLE_SHEETS_KEY:-}
      FERNWAY_GOOGLE_API: http://fake-ghl:4010
      FERNWAY_GOOGLE_TOKEN: http://fake-ghl:4010/token
      # The stand-in GHL, and the CI machine itself, where the Laravel step runs a fresh Laravel app to receive webhooks.
      FERNWAY_WEBHOOK_INSECURE_HOSTS: fake-ghl,host.docker.internal
  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FERNWAY_GHL_API: http://fake-ghl:4010
      # Claude score against the stand-in Claude in fake-ghl.mjs.
      ANTHROPIC_API_KEY: ci-claude-key
      FERNWAY_CLAUDE_API: http://fake-ghl:4010
      GOOGLE_SHEETS_KEY: ${CI_GOOGLE_SHEETS_KEY:-}
      FERNWAY_GOOGLE_API: http://fake-ghl:4010
      FERNWAY_GOOGLE_TOKEN: http://fake-ghl:4010/token
      # The stand-in GHL, and the CI machine itself, where the Laravel step runs a fresh Laravel app to receive webhooks.
      FERNWAY_WEBHOOK_INSECURE_HOSTS: fake-ghl,host.docker.internal
