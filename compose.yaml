# Fernway on one box: Postgres 16, a migration step, Redis (the delivery queue), the web app and the worker.
# Secrets come from an env file outside git (on the box: /srv/fernway/.env, owner fernway, mode 600):
# POSTGRES_PASSWORD, FERNWAY_APP_PASSWORD, REDIS_PASSWORD, APP_URL, GHL_CLIENT_ID, GHL_CLIENT_SECRET, FERNWAY_TOKEN_KEY.
# Hex passwords only (openssl rand -hex 32), so they sit in a
# URL as they are.
# Run: docker compose --env-file /srv/fernway/.env up -d --build
name: fernway

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fernway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fernway"]
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *logs

  # Runs once per deploy and exits: new migrations, then the app role's password.
  migrate:
    image: postgres:16
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: fernway
      FERNWAY_APP_PASSWORD: ${FERNWAY_APP_PASSWORD:?set FERNWAY_APP_PASSWORD}
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "/db/migrate.sh"]
    <<: *logs

  # The delivery queue. Append-only file on, so a restart never loses a queued retry. No port leaves the network.
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    <<: *logs

  web:
    build:
      context: .
      target: web
      args:
        APP_COMMIT: ${APP_COMMIT:-dev}
    image: fernway-web:${APP_COMMIT:-dev}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fernway_app:${FERNWAY_APP_PASSWORD}@db:5432/fernway
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # The account the public site's own forms deliver into (the GHL sandbox); its leads are kept 30 days.
      FERNWAY_SITE_ACCOUNT: ${FERNWAY_SITE_ACCOUNT:-1}
      # The Break it demo's own account: its leads only ever meet the stand-in GHL, and go after a day.
      FERNWAY_DEMO_ACCOUNT: ${FERNWAY_DEMO_ACCOUNT:-2}
      # The public key printed in the docs. Shown only if it is a live key of the demo account.
      FERNWAY_DOCS_KEY: ${FERNWAY_DOCS_KEY:-}
      # Accounts (sign up, sign in, the account area) stay off until switched on; email goes through Resend once its
      # key is set. The outbox is for CI only: it keeps emails in Redis instead of sending them.
      FERNWAY_ACCOUNTS: ${FERNWAY_ACCOUNTS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FERNWAY_MAIL_OUTBOX: ${FERNWAY_MAIL_OUTBOX:-}
      # Claude score's cap a month, for the operator console's watcher (the key itself stays with the worker).
      CLAUDE_MONTH_CAP_USD: ${CLAUDE_MONTH_CAP_USD:-8}
      # Google Sheets: Fernway's service account key (base64 JSON), to check a sheet when an owner links it.
      GOOGLE_SHEETS_KEY: ${GOOGLE_SHEETS_KEY:-}
      FERNWAY_GOOGLE_API: ${FERNWAY_GOOGLE_API:-}
      FERNWAY_GOOGLE_TOKEN: ${FERNWAY_GOOGLE_TOKEN:-}
      # Stripe, test mode only (the app refuses a live key). Billing stays off until both are set.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_URL: ${APP_URL:-https://fernway.jeromebadour.com}
      GHL_CLIENT_ID: ${GHL_CLIENT_ID:?set GHL_CLIENT_ID}
      GHL_CLIENT_SECRET: ${GHL_CLIENT_SECRET:?set GHL_CLIENT_SECRET}
      # The app's shared secret from GHL's developer portal, for Fernway's page inside GHL; the page stays shut without it.
      GHL_SSO_KEY: ${GHL_SSO_KEY:-}
      # The header GHL's app settings send with each workflow trigger and action call; the workflow addresses stay shut without it.
      FERNWAY_WORKFLOW_KEY: ${FERNWAY_WORKFLOW_KEY:-}
      FERNWAY_TOKEN_KEY: ${FERNWAY_TOKEN_KEY:?set FERNWAY_TOKEN_KEY}
    # Only Nginx on the same box reaches it.
    ports:
      - "127.0.0.1:3103:3000"
    <<: *logs

  worker:
    build:
      context: .
      target: worker
      args:
        APP_COMMIT: ${APP_COMMIT:-dev}
    image: fernway-worker:${APP_COMMIT:-dev}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fernway_app:${FERNWAY_APP_PASSWORD}@db:5432/fernway
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # The account the public site's own forms deliver into (the GHL sandbox); its leads are kept 30 days.
      FERNWAY_SITE_ACCOUNT: ${FERNWAY_SITE_ACCOUNT:-1}
      # The Break it demo's own account: its leads only ever meet the stand-in GHL, and go after a day.
      FERNWAY_DEMO_ACCOUNT: ${FERNWAY_DEMO_ACCOUNT:-2}
      APP_URL: ${APP_URL:-https://fernway.jeromebadour.com}
      GHL_CLIENT_ID: ${GHL_CLIENT_ID:?set GHL_CLIENT_ID}
      GHL_CLIENT_SECRET: ${GHL_CLIENT_SECRET:?set GHL_CLIENT_SECRET}
      FERNWAY_TOKEN_KEY: ${FERNWAY_TOKEN_KEY:?set FERNWAY_TOKEN_KEY}
      # For the stripe-catalog command only (test mode).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Alert emails (a lead held or returned, Monday's summary): Resend, or the outbox in local work and CI.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FERNWAY_MAIL_OUTBOX: ${FERNWAY_MAIL_OUTBOX:-}
      # Claude score: Fernway's own key (its own workspace, capped in Anthropic's console), and Fernway's own cap a month.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MONTH_CAP_USD: ${CLAUDE_MONTH_CAP_USD:-8}
      # Google Sheets: Fernway's service account key (base64 JSON); the sheets are the ones owners shared with it.
      GOOGLE_SHEETS_KEY: ${GOOGLE_SHEETS_KEY:-}
      FERNWAY_GOOGLE_API: ${FERNWAY_GOOGLE_API:-}
      FERNWAY_GOOGLE_TOKEN: ${FERNWAY_GOOGLE_TOKEN:-}
    <<: *logs

volumes:
  pgdata:
  redisdata:
