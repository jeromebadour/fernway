# The proxy to the Alder & Pike WordPress (port 3105). Installed to /etc/nginx/snippets/ by setup.sh.
# X-Real-IP is always replaced with the address Nginx saw, so a visitor can't choose their own (WordPress trusts it).
proxy_pass http://127.0.0.1:3105;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
